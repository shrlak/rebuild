name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (TTS for e2e speech synthesis, PortAudio)
        run: sudo apt-get update && sudo apt-get install -y espeak-ng libportaudio2

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-${{ runner.os }}

      - name: Install package
        run: pip install -e ".[desktop,dev]"

      - name: Fast unit tests
        run: pytest -m "not slow" -q

      - name: End-to-end tests (real ASR model)
        run: pytest -m slow -q
